[project]
name = "chat-with-your-docs-backend"
version = "0.1.0"
description = "Backend for the Chat With Your Docs RAG application."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "docling>=2.0",
    "langchain-core>=0.3",
    "langchain-text-splitters>=0.3",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv]
package = false
